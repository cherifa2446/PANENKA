backend:
  name: git-gateway
  branch: main

media_folder: "images/upload"
public_folder: "/images/upload"

collections:
  - name: "settings"
    label: "Contenu du site"
    files:
      - name: "photos"
        label: "Nos photos"
        file: "content/photos.json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.title}} - {{fields.team}}"
            fields:
              - label: "Titre de la photo"
                name: "title"
                widget: "string"

              - label: "Équipe / texte en dessous"
                name: "team"
                widget: "string"

              - label: "Image"
                name: "image"
                widget: "image"

              - label: "Couleur de secours"
                name: "theme"
                widget: "select"
                required: false
                options:
                  - label: "Rouge"
                    value: "red"
                  - label: "Bleu"
                    value: "blue"
                  - label: "Vert"
                    value: "green"
                  - label: "Gris"
                    value: "gray"

      - name: "blog"
        label: "Blog"
        file: "content/blog.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Titre de l'article"
                name: "title"
                widget: "string"

              - label: "Lien de l'article"
                name: "slug"
                widget: "string"
                hint: "Exemple : premier-article-panenka. Mets seulement des lettres minuscules, des chiffres et des tirets."

              - label: "Catégorie"
                name: "category"
                widget: "string"
                required: false

              - label: "Date"
                name: "date"
                widget: "datetime"
                required: false

              - label: "Image principale"
                name: "image"
                widget: "image"
                required: false

              - label: "Résumé"
                name: "excerpt"
                widget: "text"

              - label: "Contenu complet"
                name: "content"
                widget: "markdown"